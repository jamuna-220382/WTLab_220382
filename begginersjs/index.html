<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Tasks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1><center>JAVASCRIPT TASKS</center></h1>

<p id="text"><b>Arrays are lists of values.</b></p>

<button onclick="changeText()">Change Text</button>
<button onclick="undoChange()">Undo Change</button>
<button onclick="addText()">Add Text</button>
<button onclick="removeText()">Remove Text</button>

<div id="container"></div>

<h2 id="task5">TASK-5</h2>
<button onclick="applyStyle()">Apply Style</button>
<button onclick="toggleStyle()">Toggle Style</button>

<h2 id="hover">Hover over me</h2>

<h3>Form</h3>
<form id="myForm">
    <input type="text" id="name" placeholder="Enter name" required><br><br>
    <input type="number" id="age" placeholder="Enter age" required><br><br>
    <input type="email" id="email" placeholder="Enter email" required><br><br>
    <button type="submit">Submit</button>
</form>

<p id="result"></p>

<button onclick="printPage()">Print Page</button>

<script src="script.js"></script>
</body>
</html>
